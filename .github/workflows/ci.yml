name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Only a pull_request run is cancelled in progress by a newer run in its group; a running push or manual run is never cancelled (the release gate counts push runs on main), though a pending run waiting for the slot is still replaced by a newer one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  web:
    name: Typecheck, unit tests, website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm ci --prefix website
      # `npm run build` typechecks (tsc --noEmit) and writes dist/, which
      # tests/bundle.test.mjs reads.
      - run: npm run build
      # Includes tests/extensions-examples.test.mjs: every examples/extensions package, the public SDK
      # against the shared schema, the compatibility corpus and the author guide's generated tables.
      # The rust job's `cargo test --lib` installs the same examples and corpus natively.
      - run: npm test
      - run: npm run test:release
      - run: npm run site:build

  extensions-browser:
    name: Extension baseline and lifecycle (browser preview)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Locate disposable Chromium and identify the tested revision
        run: |
          node -e 'console.log("PANDACODE_TEST_CHROME=" + require("playwright").chromium.executablePath())' >> "$GITHUB_ENV"
          echo "BASELINE_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
      # These are real frontend lifecycle tests, not native desktop/IPC qualification.
      - name: Chromium extension conformance
        env: { PW_PORT: '15435', PW_PROD: '1' }
        run: npx playwright test tests/extensions-baseline.spec.ts tests/extensions-install.spec.ts tests/extensions-catalog.spec.ts tests/extensions-layout.spec.ts tests/extensions-menus.spec.ts tests/extensions-dialogs.spec.ts tests/extensions-view-actions.spec.ts tests/extensions-thread-actions.spec.ts tests/extensions-settings-actions.spec.ts tests/extensions-windows.spec.ts tests/extensions-context.spec.ts tests/extensions-inventory.spec.ts tests/extensions-project-reads.spec.ts --workers=1
      - name: WebKit extension conformance
        env: { PW_PORT: '15436', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-baseline.spec.ts tests/extensions-install.spec.ts tests/extensions-catalog.spec.ts tests/extensions-layout.spec.ts tests/extensions-menus.spec.ts tests/extensions-dialogs.spec.ts tests/extensions-view-actions.spec.ts tests/extensions-thread-actions.spec.ts tests/extensions-settings-actions.spec.ts tests/extensions-windows.spec.ts tests/extensions-context.spec.ts tests/extensions-inventory.spec.ts tests/extensions-project-reads.spec.ts --workers=1
      - name: Runtime grants (Chromium)
