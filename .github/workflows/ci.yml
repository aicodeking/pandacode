name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Only a pull_request run is cancelled in progress by a newer run in its group; a running push or manual run is never cancelled (the release gate counts push runs on main), though a pending run waiting for the slot is still replaced by a newer one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  web:
    name: Typecheck, unit tests, website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm ci --prefix website
      # `npm run build` typechecks (tsc --noEmit) and writes dist/, which
      # tests/bundle.test.mjs reads.
      - run: npm run build
      # Includes tests/extensions-examples.test.mjs: every examples/extensions package, the public SDK
      # against the shared schema, the compatibility corpus and the author guide's generated tables.
      # The rust job's `cargo test --lib` installs the same examples and corpus natively.
      - run: npm test
      - run: npm run test:release
      - run: npm run site:build

  extensions-browser:
    name: Extension baseline and lifecycle (browser preview)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Locate disposable Chromium and identify the tested revision
        run: |
          node -e 'console.log("PANDACODE_TEST_CHROME=" + require("playwright").chromium.executablePath())' >> "$GITHUB_ENV"
          echo "BASELINE_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
      # These are real frontend lifecycle tests, not native desktop/IPC qualification.
      - name: Chromium extension conformance
        env: { PW_PORT: '15435', PW_PROD: '1' }
        run: npx playwright test tests/extensions-baseline.spec.ts tests/extensions-install.spec.ts tests/extensions-catalog.spec.ts tests/extensions-layout.spec.ts tests/extensions-menus.spec.ts tests/extensions-dialogs.spec.ts tests/extensions-view-actions.spec.ts tests/extensions-thread-actions.spec.ts tests/extensions-settings-actions.spec.ts tests/extensions-windows.spec.ts tests/extensions-context.spec.ts tests/extensions-inventory.spec.ts tests/extensions-project-reads.spec.ts --workers=1
      - name: WebKit extension conformance
        env: { PW_PORT: '15436', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-baseline.spec.ts tests/extensions-install.spec.ts tests/extensions-catalog.spec.ts tests/extensions-layout.spec.ts tests/extensions-menus.spec.ts tests/extensions-dialogs.spec.ts tests/extensions-view-actions.spec.ts tests/extensions-thread-actions.spec.ts tests/extensions-settings-actions.spec.ts tests/extensions-windows.spec.ts tests/extensions-context.spec.ts tests/extensions-inventory.spec.ts tests/extensions-project-reads.spec.ts --workers=1
      - name: Runtime grants (Chromium)
        env: { PW_PORT: '15437', PW_PROD: '1' }
        run: npx playwright test tests/extensions-runtime-grants.spec.ts --workers=1
      - name: Runtime grants (WebKit)
        env: { PW_PORT: '15438', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-runtime-grants.spec.ts --workers=1
      - name: Trusted development preview (Chromium)
        env:
          PW_PORT: '1435'
          PW_PROD: '1'
        run: npx playwright test tests/extensions-development.spec.ts --workers=1
      - name: Trusted development preview (WebKit)
        env:
          PW_PORT: '1436'
          PW_PROD: '1'
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-development.spec.ts --workers=1
      - name: Private extension storage (Chromium)
        env: { PW_PORT: '1437', PW_PROD: '1' }
        run: npx playwright test tests/extensions-storage.spec.ts --workers=1
      - name: Private extension storage (WebKit)
        env: { PW_PORT: '1438', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-storage.spec.ts --workers=1

      - name: Dynamic inspector views (Chromium)
        env: { PW_PORT: '1439', PW_PROD: '1' }
        run: npx playwright test tests/extensions-views.spec.ts --workers=1
      - name: Dynamic inspector views (WebKit)
        env: { PW_PORT: '1440', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-views.spec.ts --workers=1
      - name: Isolated rich views (Chromium, browser characterization only)
        env: { PW_PORT: '1441', PW_PROD: '1' }
        run: npx playwright test tests/extensions-rich-views.spec.ts --workers=1
      - name: Isolated rich views (WebKit, browser characterization only)
        env: { PW_PORT: '1442', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-rich-views.spec.ts --workers=1
      - name: Stateful view placement (Chromium)
        env: { PW_PORT: '1443', PW_PROD: '1' }
        run: npx playwright test tests/extensions-placement.spec.ts --workers=1
      - name: Stateful view placement (WebKit)
        env: { PW_PORT: '1444', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-placement.spec.ts --workers=1
      - name: Component replacement (Chromium)
        env: { PW_PORT: '1447', PW_PROD: '1' }
        run: npx playwright test tests/extensions-replacement.spec.ts tests/extensions-composer-conformance.spec.ts tests/extensions-transcript-conformance.spec.ts --workers=1
      - name: Component replacement (WebKit)
        env: { PW_PORT: '1448', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-replacement.spec.ts tests/extensions-composer-conformance.spec.ts tests/extensions-transcript-conformance.spec.ts --workers=1
      # Document byte fixtures are served from tests/fixtures by Vite development mode.
      - name: Document presentation (Chromium preview)
        env: { PW_PORT: '1455' }
        run: npx playwright test tests/extensions-documents-coverage.spec.ts tests/extensions-diff-coverage.spec.ts tests/extensions-search-coverage.spec.ts tests/changes-view.spec.ts tests/document-viewer.spec.ts tests/office-viewer.spec.ts --workers=1
      - name: Document presentation (WebKit preview)
        env: { PW_PORT: '1456' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-documents-coverage.spec.ts tests/extensions-diff-coverage.spec.ts tests/extensions-search-coverage.spec.ts tests/changes-view.spec.ts tests/document-viewer.spec.ts tests/office-viewer.spec.ts --workers=1
      - name: Browser and Terminal presentation (Chromium preview)
        # Guest/PTY continuity is synthetic here; installed native windows are qualified separately.
        env: { PW_PORT: '1449', PW_PROD: '1' }
        run: npx playwright test tests/extensions-content-coverage.spec.ts tests/extensions-tools-coverage.spec.ts tests/extensions-board-coverage.spec.ts tests/extensions-github-hub-coverage.spec.ts tests/extensions-pull-coverage.spec.ts tests/extensions-worktrees-coverage.spec.ts tests/extensions-settings-coverage.spec.ts tests/extensions-sidebar-coverage.spec.ts tests/extensions-sidebar-bots-coverage.spec.ts tests/extensions-team-controls-coverage.spec.ts tests/extensions-agent-roster-coverage.spec.ts tests/extensions-status-coverage.spec.ts tests/extensions-core-dialogs-coverage.spec.ts tests/extensions-owned-dialogs-coverage.spec.ts tests/extensions-moodboards-coverage.spec.ts tests/extensions-cloud-coverage.spec.ts tests/extensions-machine-coverage.spec.ts tests/extensions-workspace-coverage.spec.ts tests/extensions-browser-coverage.spec.ts tests/extensions-terminal-coverage.spec.ts tests/extensions-simulator-coverage.spec.ts tests/extensions-vm-coverage.spec.ts tests/extensions-design-coverage.spec.ts tests/extensions-btw-coverage.spec.ts tests/extensions-project-scope.spec.ts tests/extensions-composer-controls-coverage.spec.ts tests/extensions-composer-panels-coverage.spec.ts tests/extensions-attach-wake-coverage.spec.ts tests/extensions-thread-extras-coverage.spec.ts tests/extensions-tiles-picker-coverage.spec.ts tests/extensions-commands-extras-coverage.spec.ts tests/extensions-task-menus-coverage.spec.ts tests/extensions-window-menus-coverage.spec.ts tests/extensions-bot-conversation-coverage.spec.ts tests/extensions-gap-closure.spec.ts --workers=1
      - name: Browser and Terminal presentation (WebKit preview)
        env: { PW_PORT: '1450', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-content-coverage.spec.ts tests/extensions-tools-coverage.spec.ts tests/extensions-board-coverage.spec.ts tests/extensions-github-hub-coverage.spec.ts tests/extensions-pull-coverage.spec.ts tests/extensions-worktrees-coverage.spec.ts tests/extensions-settings-coverage.spec.ts tests/extensions-sidebar-coverage.spec.ts tests/extensions-sidebar-bots-coverage.spec.ts tests/extensions-team-controls-coverage.spec.ts tests/extensions-agent-roster-coverage.spec.ts tests/extensions-status-coverage.spec.ts tests/extensions-core-dialogs-coverage.spec.ts tests/extensions-owned-dialogs-coverage.spec.ts tests/extensions-moodboards-coverage.spec.ts tests/extensions-cloud-coverage.spec.ts tests/extensions-machine-coverage.spec.ts tests/extensions-workspace-coverage.spec.ts tests/extensions-browser-coverage.spec.ts tests/extensions-terminal-coverage.spec.ts tests/extensions-simulator-coverage.spec.ts tests/extensions-vm-coverage.spec.ts tests/extensions-design-coverage.spec.ts tests/extensions-btw-coverage.spec.ts tests/extensions-project-scope.spec.ts tests/extensions-composer-controls-coverage.spec.ts tests/extensions-composer-panels-coverage.spec.ts tests/extensions-attach-wake-coverage.spec.ts tests/extensions-thread-extras-coverage.spec.ts tests/extensions-tiles-picker-coverage.spec.ts tests/extensions-commands-extras-coverage.spec.ts tests/extensions-task-menus-coverage.spec.ts tests/extensions-window-menus-coverage.spec.ts tests/extensions-bot-conversation-coverage.spec.ts tests/extensions-gap-closure.spec.ts --workers=1
      - name: Original terminal controllers (Chromium development preview)
        # Legacy source-injection tests need the development preview, not PW_PROD.
        env: { PW_PORT: '1457' }
        run: npx playwright test tests/terminal.spec.ts --workers=1
      - name: Original terminal controllers (WebKit development preview)
        env: { PW_PORT: '1458' }
        run: npx playwright test -c playwright.webkit.config.ts tests/terminal.spec.ts --workers=1
      - name: Original BTW controllers (Chromium development preview)
        env: { PW_PORT: '1475' }
        run: npx playwright test tests/btw.spec.ts --workers=1
      - name: Original BTW controllers (WebKit development preview)
        env: { PW_PORT: '1476' }
        run: npx playwright test -c playwright.webkit.config.ts tests/btw.spec.ts --workers=1
      - name: Extension tools and API connections (Chromium preview)
        env: { PW_PORT: '1449', PW_PROD: '1' }
        run: npx playwright test tests/extensions-jobs.spec.ts tests/extensions-connections.spec.ts tests/extensions-services.spec.ts --workers=1
      - name: Extension tools and API connections (WebKit preview)
        env: { PW_PORT: '1450', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-jobs.spec.ts tests/extensions-connections.spec.ts tests/extensions-services.spec.ts --workers=1
      - name: Extension appearance (Chromium)
        env: { PW_PORT: '1445', PW_PROD: '1' }
        run: npx playwright test tests/extensions-appearance.spec.ts --workers=1
      - name: Shared declarative primitives (Chromium preview)
        env: { PW_PORT: '1445', PW_PROD: '1' }
        run: npx playwright test tests/extensions-primitives-coverage.spec.ts --workers=1
      - name: Shared declarative primitives (WebKit preview)
        env: { PW_PORT: '1446', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-primitives-coverage.spec.ts --workers=1
      - name: Integrated controls audit (Chromium preview)
        env: { PW_PORT: '1445', PW_PROD: '1' }
        run: npx playwright test tests/extensions-controls-coverage.spec.ts --workers=1
      - name: Integrated controls audit (WebKit preview)
        env: { PW_PORT: '1446', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-controls-coverage.spec.ts --workers=1
      - name: Auxiliary windows and native menu (Chromium preview)
        # Synthetic IPC and OS-menu delivery; the native menu policy is covered by cargo tests, installed windows are qualified separately.
        env: { PW_PORT: '1445', PW_PROD: '1' }
        run: npx playwright test tests/extensions-window-coverage.spec.ts --workers=1
      - name: Auxiliary windows and native menu (WebKit preview)
        env: { PW_PORT: '1446', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-window-coverage.spec.ts --workers=1
      - name: Persisted provider history (Chromium preview)
        env: { PW_PORT: '1451', PW_PROD: '1' }
        run: npx playwright test tests/extensions-provider-history.spec.ts --workers=1
      - name: Persisted provider history (WebKit preview)
        env: { PW_PORT: '1452', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-provider-history.spec.ts --workers=1
      - name: Extension appearance (WebKit)
        env: { PW_PORT: '1446', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-appearance.spec.ts --workers=1
      - name: Package harness lifecycle (Chromium preview)
        env: { PW_PORT: '1453', PW_PROD: '1' }
        run: npx playwright test tests/extensions-harness.spec.ts tests/extensions-provider-catalog.spec.ts tests/extensions-provider-teams.spec.ts tests/extensions-provider-cli.spec.ts tests/extensions-provider-skills.spec.ts tests/extensions-remote.spec.ts --workers=1
      - name: Package harness lifecycle (WebKit preview)
        env: { PW_PORT: '1454', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-harness.spec.ts tests/extensions-provider-catalog.spec.ts tests/extensions-provider-teams.spec.ts tests/extensions-provider-cli.spec.ts tests/extensions-provider-skills.spec.ts tests/extensions-remote.spec.ts --workers=1

      # Absolute ceilings and leak/order gates always apply; the relative M0 comparison is reported as
      # incomparable on a shared runner (different machine from the frozen population), never as a pass.
      - name: Performance, scale and resource lifetime (Chromium production preview)
        env: { PW_PORT: '1469', PW_PROD: '1' }
        run: npx playwright test tests/extensions-performance.spec.ts --workers=1
      - name: Performance, scale and resource lifetime (WebKit production preview)
        env: { PW_PORT: '1470', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-performance.spec.ts --workers=1

      - name: Multiwindow workspace ownership (Chromium preview)
        env: { PW_PORT: '1467', PW_PROD: '1' }
        run: npx playwright test tests/extensions-multiwindow.spec.ts tests/extensions-updates.spec.ts --workers=1
      - name: Multiwindow workspace ownership (WebKit preview)
        env: { PW_PORT: '1468', PW_PROD: '1' }
        run: npx playwright test -c playwright.webkit.config.ts tests/extensions-multiwindow.spec.ts tests/extensions-updates.spec.ts --workers=1

  rust:
    name: Rust check and tests (Linux)
    runs-on: ubuntu-22.04
    # Tests and clippy, then the up-to-55-minute release smoke.
    timeout-minutes: 120
    env:
      # Same x86_64 transcribe-cpp floor as the linux-x86_64 release row (see release.yml).
      TRANSCRIBE_CMAKE_ARGS: '-DTRANSCRIBE_X86_CONSERVATIVE=ON -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install Linux native dependencies
        # Normally ~30 s; a stalled mirror otherwise holds the job until its own timeout.
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libasound2-dev build-essential curl wget file libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf xvfb dbus-x11 xdg-utils libasound2-plugins
      # Tauri embeds the built frontend, so dist/ must exist before cargo runs.
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # CI runners have no sound card, so ALSA's default can't capture and the smoke would skip. A
      # null default captures silence, and its hint makes cpal list `default` as the default input.
      # libasound2-plugins (installed above) defines `jack`, which lists with no JACK server, so the
      # smoke also checks that dictation on a saved `jack` falls back to this default.
      - name: Null ALSA default input
        run: printf '%s\n' 'pcm.!default { type null; hint { show on; description "CI null capture" } }' > ~/.asoundrc
      # The real audio smoke under the release profile, as in rust-platforms.
      - name: Real audio smoke (release profile)
        timeout-minutes: 55
        env:
          PANDACODE_REQUIRE_REAL_MIC: '1'
        shell: bash
        # `--exact` passes a filter that matches nothing (`0 passed`), so require the one test to run,
        # and require the jack/oss fallback line, which the test skips silently if jack is missing.
        # `shell: bash` runs with `-eo pipefail`, so a cargo failure still fails through `tee`.
        run: |
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib voice::tests::real_audio::real_audio_lists_opens_and_records -- --exact --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/real-audio.log"
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/real-audio.log"
          grep -q 'fell back to the default input' "$RUNNER_TEMP/real-audio.log"

  router:
    # x86_64 Linux builds without ONNX Runtime (see `panda_onnx` in src-tauri/build.rs), so Panda Router's
    # ONNX parity tests run here, on a target that links it.
    name: Panda Router ONNX parity (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      # Panda Router's ONNX profiler for the parity tests, pinned like panda_router::ASSETS.
      # The tests fail rather than skip when CI is set and these are missing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .panda-router
          key: panda-router-v4-b52d463905808efd892c91917e3010985359e259fe7a514ae083967c98fa2216-ca870c678352403d107496dc78899fa666ed0f56fef63e88ae398fafe5d78c45
      - name: Fetch Panda Router profiler
        run: |
          base=https://raw.githubusercontent.com/aicodeking/PandaOrchestrator/83e408c794ef1d09b6d13b6ad8734e984f552402/artifacts/panda-router-v4
          mkdir -p .panda-router
          while read -r sha file; do
            [ -f ".panda-router/$file" ] || curl -fsSL --retry 3 -o ".panda-router/$file" "$base/$file"
            echo "$sha  .panda-router/$file" | shasum -a 256 -c -
          done <<'EOF'
          b52d463905808efd892c91917e3010985359e259fe7a514ae083967c98fa2216 model.int8.onnx
          ca870c678352403d107496dc78899fa666ed0f56fef63e88ae398fafe5d78c45 tokenizer.json
          EOF
          echo "PANDA_ROUTER_ASSETS=$PWD/.panda-router" >> "$GITHUB_ENV"
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- panda_router model_routing

  rust-platforms:
    # Builds the Rust library (and transcribe-cpp, the native speech engine) on the release targets the
    # Linux job does not cover, so a platform-only break shows up in CI instead of first at release time.
    # Each row copies its release.yml build row: same runner and TRANSCRIBE_CMAKE_ARGS (see the comment
    # there; an empty value adds no CMake arguments). Clippy covers the same targets as the Linux job;
    # tests stay on Linux, except the release-profile real-audio smoke (as in the Linux job) on macOS,
    # Windows x64 and Linux arm64. The Linux arm64 row installs the same native packages as the Linux job.
    name: Rust clippy (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon: the crate's build.rs already sets GGML_NATIVE=OFF on macOS.
          - { os: macos-latest, target: darwin-aarch64, transcribe_cmake: '' }
          # Intel Mac on its native runner, with the x86_64 SSE4.2/AVX/F16C floor.
          - { os: macos-15-intel, target: darwin-x86_64, transcribe_cmake: '-DTRANSCRIBE_X86_CONSERVATIVE=ON -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON' }
          # Windows x64 on the release runner, with the baseline SSE4.2/AVX/F16C floor.
          - { os: windows-2022, target: windows-x86_64, transcribe_cmake: '-DTRANSCRIBE_X86_CONSERVATIVE=ON -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON' }
          # Windows arm64 builds native (ggml refuses GGML_NATIVE=OFF with MSVC on ARM), as in release.yml:
          # dotprod/i8mm from the runner, SVE and SME pinned off (platform.rs checks neither).
          - { os: windows-11-arm, target: windows-aarch64, transcribe_cmake: '-DGGML_MACHINE_SUPPORTS_sve=OFF -DGGML_MACHINE_SUPPORTS_sme=OFF' }
          # Linux arm64 pinned to plain ARMv8-A, never the runner's CPU.
          - { os: ubuntu-24.04-arm, target: linux-aarch64, transcribe_cmake: '-DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8-a' }
    runs-on: ${{ matrix.os }}
    # Clippy plus the up-to-75-minute release smoke on the rows that run it.
    timeout-minutes: 120
    env:
      TRANSCRIBE_CMAKE_ARGS: ${{ matrix.transcribe_cmake }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libasound2-dev build-essential curl wget file libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf xvfb dbus-x11 xdg-utils libasound2-plugins
      # Tauri embeds the built frontend, so dist/ must exist before cargo runs.
      - run: npm ci
      # The release startup smoke flaked on windows-11-arm (cold Node starts), so its tests run there too.
      - name: Release startup smoke tests (Windows arm64)
        if: matrix.target == 'windows-aarch64'
        run: node --test scripts/release/ci-startup-smoke.test.mjs
      - run: npm run build
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # CI runners have no sound card, so ALSA's default can't capture and the smoke would skip. A
      # null default captures silence, and its hint makes cpal list `default` as the default input.
      # libasound2-plugins (installed above) defines `jack`, which lists with no JACK server, so the
      # smoke also checks that dictation on a saved `jack` falls back to this default.
      - name: Null ALSA default input
        if: runner.os == 'Linux'
        run: printf '%s\n' 'pcm.!default { type null; hint { show on; description "CI null capture" } }' > ~/.asoundrc
      # The real audio stack under the shipped release profile: cpal 0.16's undefined behaviour only
      # crashed optimised builds, so debug tests passed while the released app segfaulted.
      # macOS and Linux require a recording; the Windows x64 runner may have no usable input, so there
      # the smoke lists devices, opens the default if one exists, and passes without one.
      - name: Real audio smoke (release profile)
        if: runner.os == 'macOS' || matrix.target == 'windows-x86_64' || matrix.target == 'linux-aarch64'
        # The release build alone took ~34 min on darwin-x86_64, and the whole step up to 43 min.
        timeout-minutes: 75
        # macOS runners have virtual inputs (Null Audio Device, Apple Virtual Sound Device) and Linux
        # has the null default above, so a runner with no input must fail instead of passing.
        env:
          PANDACODE_REQUIRE_REAL_MIC: ${{ runner.os != 'Windows' && '1' || '' }}
        shell: bash
        # `--exact` passes a filter that matches nothing (`0 passed`), so require the one test to run;
        # on Linux also require the jack/oss fallback line, which the test skips silently if jack is
        # missing. `shell: bash` runs with `-eo pipefail`, so a cargo failure still fails through `tee`.
        run: |
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib voice::tests::real_audio::real_audio_lists_opens_and_records -- --exact --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/real-audio.log"
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/real-audio.log"
          if [ "$RUNNER_OS" = Linux ]; then grep -q 'fell back to the default input' "$RUNNER_TEMP/real-audio.log"; fi
