[package]
name = "pandacode"
version = "0.3.85"
description = "A lightweight native workspace for coding agents"
authors = ["PandaCode contributors"]
edition = "2021"

[lib]
name = "pandacode_lib"
# Desktop only links the rlib; add "staticlib", "cdylib" back for mobile targets.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "=0.9.12", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7"] }
portable-pty = "0.9"
ignore = "0.4.33"
regex = "1"
flate2 = "=1.1.10"
libc = "0.2"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
des = "0.8"
shell-words = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-updater = ">=2, <2.10"
tauri-plugin-process = ">=2, <2.4"
if-addrs = "=0.15.0"
cpal = "0.18.2"
hound = "3.5.1"
sherpa-onnx = "2.0.0"
tar = "0.4.46"
bzip2 = "0.6.1"
num-traits = "0.2.19"
# Panda Router (src/panda_router): deterministic matcher; the ONNX profiler is target-gated below.
libm = "0.2"

# Panda Router's ONNX profiler (static ONNX Runtime) only where a prebuilt runtime links: none exists for
# Intel macOS, and the x86_64 Linux one needs glibc 2.38 (releases build on Ubuntu 22.04). Keep this
# predicate in step with `panda_onnx` in build.rs; other targets route with the keyword heuristic.
[target.'cfg(any(all(target_os = "macos", target_arch = "aarch64"), all(target_os = "linux", target_arch = "aarch64"), target_os = "windows"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }


[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6.4"
block2 = "0.6"
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "WKNavigation", "block2", "objc2-app-kit"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSAppearance", "NSColor", "NSGlassEffectView", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "objc2-core-foundation", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSGeometry", "NSData", "NSDictionary", "NSString", "NSError", "NSURL", "NSBundle"] }
objc2-speech = "0.3.2"
objc2-avf-audio = "0.3.2"

# These use the platform webview already required by Tauri; none enters the Mac build.
[target.'cfg(target_os = "windows")'.dependencies]
dunce = "1"
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Security"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
cairo-rs = { version = "0.18", features = ["png"] }
gio = "0.18"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

# Local/test builds (`--profile fast-release`); shipped builds use release.
[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
